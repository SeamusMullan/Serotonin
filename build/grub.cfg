set gfxpayload=1920x1080x32

menuentry "Serotonin" {
	echo "Loading kernel..."
	multiboot /boot/serotonin.bin quiet
}

menuentry "Serotonin: info" {
	echo "Loading kernel..."
	multiboot /boot/serotonin.bin info
}

menuentry "Serotonin: rootfs from ISO" {
	echo "Loading kernel..."
	multiboot /boot/serotonin.bin quiet rootfs=iso
	module /boot/rootfs.img rootfs
}

menuentry "Serotonin: debug" {
	echo "Loading kernel..."
	multiboot /boot/serotonin.bin debug
}
